# DAST — OWASP ZAP no ambiente staging completo (frontend + backend + Postgres)
name: DAST-ZAP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-staging:
    name: ZAP staging (frontend + API)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v7

      - name: Preparar variáveis de ambiente CI
        run: |
          cat > .env.ci <<'EOF'
          POSTGRES_USER=aai
          POSTGRES_PASSWORD=aai_secret_ci_only
          POSTGRES_DB=aai_db
          JWT_SECRET=ci-jwt-secret-minimum-32-bytes-long!!
          GEMINI_API_KEY=
          GEMINI_MODEL=gemini-2.0-flash
          CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
          EOF

      - name: Subir stack staging com Docker Compose
        run: |
          docker compose --env-file .env.ci \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            up --build -d --wait --wait-timeout 600

      - name: Verificar saúde frontend e backend
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null \
              && curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep -qE '^(200|307|308)$'; then
              echo "Stack staging saudável."
              exit 0
            fi
            echo "Aguardando stack... tentativa $i/30"
            sleep 10
          done
          echo "Stack staging não ficou saudável a tempo."
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml ps
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml logs --no-color
          exit 1

      - name: Obter token JWT para varredura autenticada
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@admin.com","password":"admin123"}' \
            | python3 -c 'import sys, json; print(json.load(sys.stdin).get("access_token", ""))') || TOKEN=""
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            echo "ZAP_AUTH_HEADER=Authorization" >> "$GITHUB_ENV"
            echo "ZAP_AUTH_HEADER_VALUE=Bearer $TOKEN" >> "$GITHUB_ENV"
            echo "ZAP_AUTH_HEADER_SITE=localhost:8000" >> "$GITHUB_ENV"
            echo "Token obtido: varredura autenticada habilitada na API."
          else
            echo "Login falhou: varredura da API seguirá sem autenticação."
          fi

      - name: DAST - ZAP Frontend (staging)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report-frontend

      - name: DAST - ZAP API Backend
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8000
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report-backend

      - name: Encerrar stack staging
        if: always()
        run: |
          docker compose --env-file .env.ci \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            down -v --remove-orphans
