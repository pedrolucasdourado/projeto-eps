name: DevSecOps-PCDF
on: [push, pull_request]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar Ferramentas de Auditoria
        run: pip install bandit "safety>=3.0" mypy

      - name: SAST - Auditoria Bandit (Vulnerabilidades Lógicas)
        run: bandit -r src/ -ll --ini .bandit

      - name: SCA - Auditoria Safety (Bibliotecas Inseguras - Backend)
        run: safety scan --output text --file src/backend/requirements.txt || true

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        working-directory: src/frontend
        run: npm ci

      - name: SCA - Auditoria npm (Bibliotecas Inseguras - Frontend)
        working-directory: src/frontend
        run: npm audit || true

      - name: Análise Estática de Tipos - mypy
        run: mypy src/backend/app --config-file src/backend/mypy.ini --ignore-missing-imports || true
