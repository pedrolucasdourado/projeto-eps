name: DevSecOps-PCDF
on: [push, pull_request]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar Ferramentas de Auditoria
        run: pip install bandit mypy flake8 checkov

      - name: SAST - Auditoria Bandit (Vulnerabilidades Lógicas)
        run: bandit -r src/ -ll --ini .bandit

      - name: SAST - Flake8 (Estilo e Erros Estáticos Python)
        run: flake8 src/backend/app

      - name: SCA - Auditoria Safety (Bibliotecas Inseguras - Backend)
        uses: pyupio/safety-action@v1
        with:
          api-key: ${{ secrets.SAFETY_API_KEY }}
          args: --file src/backend/requirements.txt --detailed-output

      - name: Configurar Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        working-directory: src/frontend
        run: npm ci

      - name: SCA - Auditoria npm (Bibliotecas Inseguras - Frontend)
        working-directory: src/frontend
        run: npm audit --audit-level=moderate

      - name: Análise Estática de Tipos - mypy
        run: mypy src/backend/app --config-file src/backend/mypy.ini

      - name: IaC - Checkov (Dockerfiles e Docker Compose)
        run: |
          checkov -d src --framework dockerfile --compact --quiet
          checkov -f docker-compose.yml -f docker-compose.ci.yml --framework yaml --compact --quiet
