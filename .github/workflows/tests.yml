name: Tests

on: [push, pull_request]

jobs:
  test:
    name: Testes completos + cobertura ≥ 90%
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aai
          POSTGRES_PASSWORD: aai_secret
          POSTGRES_DB: aai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r src/backend/requirements.txt

      - name: Aplicar migrations no banco de teste
        run: |
          set -euo pipefail
          for f in $(ls database/flyway/sql/V*.sql | sort -V); do
            PGPASSWORD=aai_secret psql -h localhost -U aai -d aai_db -f "$f"
          done

      - name: Rodar suíte completa com gate de cobertura
        working-directory: src/backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90
        env:
          DATABASE_URL: postgresql://aai:aai_secret@localhost:5432/aai_db
          JWT_SECRET: test-secret-ci
          JWT_ALGORITHM: HS256

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: src/backend/coverage.xml
