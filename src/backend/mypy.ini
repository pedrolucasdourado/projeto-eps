[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_return_any = False
warn_unused_ignores = False
disallow_untyped_defs = False
check_untyped_defs = True
no_implicit_optional = True

[mypy-app.repositories.*]
ignore_errors = False

[mypy-app.services.*]
ignore_errors = False

[mypy-app.routers.*]
ignore_errors = False
