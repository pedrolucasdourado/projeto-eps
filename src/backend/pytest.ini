[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: testes unitarios de servicos e schemas
    integration: testes HTTP da API FastAPI
    bdd: cenarios BDD implementados com pytest-bdd
addopts = --cov=app --cov-report=term-missing --cov-report=html:coverage_html

[coverage:run]
source = app
omit =
    app/scripts/*

[coverage:report]
show_missing = true
