[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: testes unitarios de servicos e schemas
    integration: testes HTTP da API FastAPI
    bdd: cenarios BDD implementados com pytest-bdd
    postgres: testes que exigem PostgreSQL real (DATABASE_URL)
addopts = --cov=app --cov-report=term-missing --cov-report=html:coverage_html --cov-fail-under=90

[coverage:run]
source = app
omit =
    app/scripts/*

[coverage:report]
show_missing = true
