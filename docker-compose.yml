networks:
  aai_internal:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.28.0.0/16

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    networks:
      - aai_internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-aai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    shm_size: 256mb
    logging: *default-logging

  flyway:
    image: flyway/flyway:10-alpine
    networks:
      - aai_internal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aai_db}
      FLYWAY_USER: ${POSTGRES_USER:-aai}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "60"
    volumes:
      - ./database/flyway/sql:/flyway/sql:ro
    command: migrate
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *default-logging

  backend:
    build:
      context: ./src/backend
    networks:
      - aai_internal
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aai_db}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env (mín. 32 caracteres recomendado)}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://[::1]:3000}"
      ACBA_PDF_RENDERER: ${ACBA_PDF_RENDERER:-html}
      ACBA_HTML_TEMPLATE_PATH: ${ACBA_HTML_TEMPLATE_PATH:-/app/templates/acba_template.html}
      ACBA_DOCX_TEMPLATE_PATH: ${ACBA_DOCX_TEMPLATE_PATH:-/app/templates/acba_template.docx}
      LIBREOFFICE_CMD: ${LIBREOFFICE_CMD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 25s
    depends_on:
      flyway:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    tmpfs:
      - /tmp:size=256M,mode=1777
    mem_limit: 2g
    cpus: 2.0
    logging: *default-logging

  frontend:
    build:
      context: ./src/frontend
      args:
        INTERNAL_API_URL: ${INTERNAL_API_URL:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    networks:
      - aai_internal
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /app/.next/cache:size=128M,mode=1777
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

volumes:
  postgres_data:
